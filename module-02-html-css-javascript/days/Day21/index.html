<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Form + Theme Toggle</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Signup Form</h1>
    <p class="signup-count">People signed up: <span id="count">0</span></p>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
      <span>Theme:</span>
      <button class="theme-btn" id="theme-toggle">Change mode</button>
    </div>

    <!-- Signup Form -->
    <form id="signup-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Abebe Kebede" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="e.g. 0912345678 or +251912345678" required />

      <div id="error"></div>

      <button type="submit">Sign Up</button>
    </form>
  </div>

  <script src="app.js">
  </script>
</body>
</html>
