<!-- Exercise-4. Accesability -->

<section id="ex-4">
<!-- BAD: <div onclick="submitForm()">Save</div> -->
<button type="button" onclick="submitForm()">Save</button>
<!-- Fix: native <button> is focusable with Tab, activates with Enter/Space, and is announced as a button by screen readers. -->

<!-- BAD: <input type="text" placeholder="Email"> -->
<!-- <label for="email">Email</label> -->
<input id="email" type="email" name="email" autocomplete="email">
<!-- Fix: <label> gives the control an accessible name so screen readers announce “Email, edit text” instead of a nameless field. -->

<!-- BAD: <img src="injera.jpg"> -->
<img src="injera.jpg" 
alt="Plate of Ethiopian injera with stews">
<!-- Fix: alt text is read by screen readers so users who can’t see the image still get its meaning. -->
</section>
